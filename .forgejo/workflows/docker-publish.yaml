name: Docker lint, build, scan, publish, sign

on:
  push:
    branches: [ main ]
    tags: [ '*' ]

# Required secrets:
#   VAULT_ADDR:     Vault API address (e.g. https://vault.example.com)
#   VAULT_HOSTNAME: Vault JWT auth mount name (auth/jwt/<hostname>/login)
env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_HOSTNAME: ${{ secrets.VAULT_HOSTNAME }}
  REGISTRY: registry-1.docker.io
  REGISTRY_USER: captnbp
  IMAGE_NAME: gitlab-ci-image
  PLATFORM: linux/amd64

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install lint tools
        run: |
          set -euo pipefail
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if ! command -v hadolint >/dev/null 2>&1; then
            HADOLINT_VERSION=$(curl -sL https://api.github.com/repos/hadolint/hadolint/releases/latest | jq -r .tag_name)
            case "$(uname -m)" in
              x86_64) HADOLINT_ARCH="x86_64" ;;
              aarch64) HADOLINT_ARCH="arm64" ;;
            esac
            $SUDO curl -sL --fail --show-error "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-${HADOLINT_ARCH}" -o /usr/local/bin/hadolint
            $SUDO chmod 0755 /usr/local/bin/hadolint
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            $SUDO apt-get update >/dev/null
            $SUDO apt-get install -y shellcheck
          fi

      - name: Lint Dockerfile
        run: hadolint Dockerfile

      - name: Lint install_tools.sh
        run: shellcheck install_tools.sh

  build:
    name: Build & Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          set -euo pipefail
          if command -v trivy >/dev/null 2>&1; then exit 0; fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          TRIVY_VERSION=$(curl -sL https://api.github.com/repos/aquasecurity/trivy/releases/latest | jq -r .tag_name | sed -E 's/v(.*)/\1/')
          case "$(uname -m)" in
            x86_64) TRIVY_ARCH="64bit" ;;
            aarch64) TRIVY_ARCH="ARM64" ;;
          esac
          curl -sL --fail --show-error "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-${TRIVY_ARCH}.tar.gz" -o /tmp/trivy.tar.gz
          tar -zxf /tmp/trivy.tar.gz -C /tmp trivy
          $SUDO mv /tmp/trivy /usr/local/bin/trivy
          rm /tmp/trivy.tar.gz

      - name: Build image (amd64)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform ${{ env.PLATFORM }} \
            --tag ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:ci \
            --output type=oci,dest=image.tar \
            .

      - name: Trivy vulnerability scan (CycloneDX report)
        run: |
          set -euo pipefail
          trivy image --input image.tar --format cyclonedx --output scan-report.cdx.json
          trivy image --input image.tar --format template --template "@trivy-markdown.tpl" --output scan-report.md
          echo "Scan finished, see the scan-reports artifact for scan-report.md"

      - name: Trivy SBOM (SPDX)
        run: |
          set -euo pipefail
          trivy image --input image.tar --format spdx-json --output sbom.spdx.json

      - name: Upload image artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: image
          path: image.tar

      - name: Upload scan reports artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: scan-reports
          path: |
            scan-report.cdx.json
            scan-report.md
            sbom.spdx.json

  publish:
    name: Publish to OCI
    if: forgejo.ref == 'refs/heads/main' || startsWith(forgejo.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    enable-openid-connect: true
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - name: Download image artifact
        uses: forgejo/download-artifact@v7
        with:
          name: image

      - name: Install Vault
        run: |
          set -euo pipefail
          if command -v vault >/dev/null 2>&1; then exit 0; fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          OS=$(uname | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in
            x86_64) ARCH="amd64" ;;
            aarch64) ARCH="arm64" ;;
          esac
          VAULT_VERSION=$(curl -sL https://api.github.com/repos/hashicorp/vault/releases/latest | jq -r .tag_name | sed -E 's/v(.*)/\1/')
          curl -sL --fail --show-error "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_${OS}_${ARCH}.zip" -o /tmp/vault.zip
          $SUDO unzip -o /tmp/vault.zip -d /usr/local/bin
          rm /tmp/vault.zip

      - name: Get JWT from OIDC
        id: jwt
        run: |
          set -euo pipefail
          JWT=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ env.VAULT_ADDR }}" | cut -d: -f2 | cut -d'}' -f1)
          if [ -z "$JWT" ]; then
            echo "::error::Failed to retrieve JWT token"
            exit 1
          fi
          echo "::add-mask::${JWT}"
          echo "jwt=${JWT}" >> ${FORGEJO_OUTPUT}

      - name: Authenticate to Vault
        run: |
          set -euo pipefail
          VAULT_TOKEN=$(VAULT_ADDR=${{ env.VAULT_ADDR }} vault write -field=token \
            auth/jwt/${{ env.VAULT_HOSTNAME }}/login \
            role=$(basename ${{ env.FORGEJO_REPOSITORY }}) \
            jwt=${{ steps.jwt.outputs.jwt }})
          if [ -z "$VAULT_TOKEN" ]; then
            echo "::error::Vault authentication failed"
            exit 1
          fi
          echo "::add-mask::${VAULT_TOKEN}"
          echo "VAULT_TOKEN=${VAULT_TOKEN}" >> $FORGEJO_ENV

      - name: Get OCI Credentials
        run: |
          set -euo pipefail
          OCI_CREDENTIALS=$(VAULT_TOKEN=${{ env.VAULT_TOKEN }} VAULT_ADDR=${{ env.VAULT_ADDR }} \
            vault kv get -format=json secret/forgejo-runners/oci/docker-hub | jq -r '.data.data')
          OCI_USERNAME=$(echo "$OCI_CREDENTIALS" | jq -r '.username')
          OCI_PASSWORD=$(echo "$OCI_CREDENTIALS" | jq -r '.password')
          if [ -z "$OCI_USERNAME" ] || [ -z "$OCI_PASSWORD" ]; then
            echo "::error::Failed to retrieve OCI credentials"
            exit 1
          fi
          echo "::add-mask::${OCI_PASSWORD}"
          echo "OCI_USERNAME=${OCI_USERNAME}" >> $FORGEJO_ENV
          echo "OCI_PASSWORD=${OCI_PASSWORD}" >> $FORGEJO_ENV

      - name: Login to OCI Registry
        run: |
          set -euo pipefail
          echo "${{ env.OCI_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
            --username ${{ env.OCI_USERNAME }} \
            --password-stdin

      - name: Push image
        id: push
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}"
          REF="${{ forgejo.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAGS="${REF#refs/tags/} latest"
          else
            TAGS="latest"
          fi
          docker load -i image.tar
          IMAGE_DIGEST=""
          for TAG in $TAGS; do
            docker tag "${IMAGE_REF}:ci" "${IMAGE_REF}:${TAG}"
            PUSH_OUTPUT=$(docker push "${IMAGE_REF}:${TAG}" 2>&1)
            echo "$PUSH_OUTPUT"
            if [ -z "$IMAGE_DIGEST" ]; then
              IMAGE_DIGEST=$(echo "$PUSH_OUTPUT" | grep -oE 'digest: sha256:[a-f0-9]{64}' | awk '{print $2}')
            fi
          done
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::Failed to retrieve image digest"
            exit 1
          fi
          echo "image_ref=${IMAGE_REF}" >> ${FORGEJO_OUTPUT}
          echo "image_digest=${IMAGE_DIGEST}" >> ${FORGEJO_OUTPUT}
          echo "Pushed ${IMAGE_REF} (tags: ${TAGS// /,}) digest ${IMAGE_DIGEST}"

      - name: Logout on Success
        run: docker logout ${{ env.REGISTRY }}

      - name: Logout on Failure
        if: failure()
        run: docker logout ${{ env.REGISTRY }}

  sign:
    name: Sign & Attest
    if: forgejo.ref == 'refs/heads/main' || startsWith(forgejo.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    enable-openid-connect: true
    steps:
      - name: Download scan reports artifact
        uses: forgejo/download-artifact@v7
        with:
          name: scan-reports

      - name: Install Cosign
        run: |
          set -euo pipefail
          if command -v cosign >/dev/null 2>&1; then exit 0; fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          OS=$(uname | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in
            x86_64) ARCH="amd64" ;;
            aarch64) ARCH="arm64" ;;
          esac
          curl -sLO --fail --show-error "https://github.com/sigstore/cosign/releases/latest/download/cosign-${OS}-${ARCH}"
          $SUDO mv "cosign-${OS}-${ARCH}" /usr/local/bin/cosign
          $SUDO chmod 0755 /usr/local/bin/cosign

      - name: Install Vault
        run: |
          set -euo pipefail
          if command -v vault >/dev/null 2>&1; then exit 0; fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          OS=$(uname | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in
            x86_64) ARCH="amd64" ;;
            aarch64) ARCH="arm64" ;;
          esac
          VAULT_VERSION=$(curl -sL https://api.github.com/repos/hashicorp/vault/releases/latest | jq -r .tag_name | sed -E 's/v(.*)/\1/')
          curl -sL --fail --show-error "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_${OS}_${ARCH}.zip" -o /tmp/vault.zip
          $SUDO unzip -o /tmp/vault.zip -d /usr/local/bin
          rm /tmp/vault.zip

      - name: Get JWT from OIDC
        id: jwt
        run: |
          set -euo pipefail
          JWT=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ env.VAULT_ADDR }}" | cut -d: -f2 | cut -d'}' -f1)
          if [ -z "$JWT" ]; then
            echo "::error::Failed to retrieve JWT token"
            exit 1
          fi
          echo "::add-mask::${JWT}"
          echo "jwt=${JWT}" >> ${FORGEJO_OUTPUT}

      - name: Authenticate to Vault
        run: |
          set -euo pipefail
          VAULT_TOKEN=$(VAULT_ADDR=${{ env.VAULT_ADDR }} vault write -field=token \
            auth/jwt/${{ env.VAULT_HOSTNAME }}/login \
            role=$(basename ${{ env.FORGEJO_REPOSITORY }}) \
            jwt=${{ steps.jwt.outputs.jwt }})
          if [ -z "$VAULT_TOKEN" ]; then
            echo "::error::Vault authentication failed"
            exit 1
          fi
          echo "::add-mask::${VAULT_TOKEN}"
          echo "VAULT_TOKEN=${VAULT_TOKEN}" >> $FORGEJO_ENV

      - name: Get OCI Credentials
        run: |
          set -euo pipefail
          OCI_CREDENTIALS=$(VAULT_TOKEN=${{ env.VAULT_TOKEN }} VAULT_ADDR=${{ env.VAULT_ADDR }} \
            vault kv get -format=json secret/forgejo-runners/oci/docker-hub | jq -r '.data.data')
          OCI_USERNAME=$(echo "$OCI_CREDENTIALS" | jq -r '.username')
          OCI_PASSWORD=$(echo "$OCI_CREDENTIALS" | jq -r '.password')
          if [ -z "$OCI_USERNAME" ] || [ -z "$OCI_PASSWORD" ]; then
            echo "::error::Failed to retrieve OCI credentials"
            exit 1
          fi
          echo "::add-mask::${OCI_PASSWORD}"
          echo "OCI_USERNAME=${OCI_USERNAME}" >> $FORGEJO_ENV
          echo "OCI_PASSWORD=${OCI_PASSWORD}" >> $FORGEJO_ENV

      - name: Login to OCI Registry
        run: |
          set -euo pipefail
          echo "${{ env.OCI_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
            --username ${{ env.OCI_USERNAME }} \
            --password-stdin

      - name: Sign image
        run: |
          set -euo pipefail
          cosign sign --new-bundle-format --upload=true -y \
            -a sig=forgejo-ci \
            -a author=${FORGEJO_ACTOR} \
            -a source=${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}/actions/runs/${FORGEJO_RUN_NUMBER}/jobs/${FORGEJO_JOB}/attempt/${FORGEJO_RUN_ATTEMPT} \
            --key hashivault://cosign \
            ${{ needs.publish.outputs.image_ref }}@${{ needs.publish.outputs.image_digest }}

      - name: Attest CycloneDX report
        run: |
          set -euo pipefail
          cosign attest -y \
            --key hashivault://cosign \
            --type cyclonedx \
            --predicate scan-report.cdx.json \
            ${{ needs.publish.outputs.image_ref }}@${{ needs.publish.outputs.image_digest }}

      - name: Attest SBOM
        run: |
          set -euo pipefail
          cosign attest -y \
            --key hashivault://cosign \
            --type spdxjson \
            --predicate sbom.spdx.json \
            ${{ needs.publish.outputs.image_ref }}@${{ needs.publish.outputs.image_digest }}

      - name: Logout on Success
        run: docker logout ${{ env.REGISTRY }}

      - name: Logout on Failure
        if: failure()
        run: docker logout ${{ env.REGISTRY }}
